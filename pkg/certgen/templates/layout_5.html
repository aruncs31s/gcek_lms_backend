<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate of Completion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1056px;
            height: 816px;
            background: #e8f0eb;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #certificate {
            width: 1010px;
            height: 780px;
            background: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 50px rgba(34,100,60,0.18);
        }

        /* Left panel */
        .left-panel {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 300px;
            background: linear-gradient(160deg, #165c38 0%, #1f7a4a 60%, #22a05c 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
        }

        /* Botanical graphic: circles */
        .botanical {
            position: absolute;
            top: 0; left: 0;
            width: 300px; height: 300px;
            border-radius: 0 0 300px 0;
            background: rgba(255,255,255,0.04);
        }
        .botanical2 {
            position: absolute;
            bottom: 0; left: 0;
            width: 200px; height: 200px;
            border-radius: 0 200px 0 0;
            background: rgba(34,160,92,0.2);
        }

        .left-logo { margin-bottom: 30px; position: relative; z-index: 2; }
        .left-logo img { height: 70px; filter: brightness(0) invert(1); opacity: 0.9; }

        .left-title {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .left-cert {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            color: #fff;
            text-align: center;
            line-height: 1.2;
            margin: 12px 0;
            position: relative;
            z-index: 2;
        }

        .left-of {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
            position: relative;
            z-index: 2;
        }

        .left-divider { width: 40px; height: 2px; background: rgba(255,255,255,0.4); margin: 20px auto; position: relative; z-index: 2; }

        .date-block {
            text-align: center;
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }
        .date-block .date-val { color: #fff; font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; }
        .date-block .date-key { color: rgba(255,255,255,0.6); font-size: 0.55rem; letter-spacing: 3px; text-transform: uppercase; font-family: 'Josefin Sans', sans-serif; }

        /* Right content area */
        .right-content {
            position: absolute;
            left: 300px; right: 0; top: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 60px;
        }

        .presented {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 10px;
        }

        .student-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.2rem;
            color: #165c38;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .name-underline { width: 80px; height: 3px; background: #165c38; margin-bottom: 24px; border-radius: 2px; }

        .for-text {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .course-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            color: #1f7a4a;
            font-weight: 600;
            line-height: 1.3;
            max-width: 550px;
            margin-bottom: 40px;
        }

        .sig-row {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .sig-block { min-width: 160px; }
        .sig-hr { border-top: 1px solid #165c38; padding-top: 8px; }
        .sig-val { font-family: 'Josefin Sans', sans-serif; font-size: 0.8rem; color: #165c38; font-weight: 600; }
        .sig-key { font-size: 0.6rem; color: #aaa; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

        .green-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #165c38, #22a05c);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(22,92,56,0.3);
            border: 3px solid #d4f0e0;
        }
        .green-badge span { color: #fff; font-size: 2rem; }
    </style>
</head>
<body>
    <div id="certificate">
        <div class="left-panel">
            <div class="botanical"></div>
            <div class="botanical2"></div>
            <div class="left-logo"><img src="{{.LogoDataURI}}" alt="Logo"></div>
            <div class="left-title">ESDC · Learning Management System</div>
            <div class="left-cert">Certificate<br>of</div>
            <div class="left-of">Completion</div>
            <div class="left-divider"></div>
            <div class="date-block">
                <div class="date-val">{{.DateIssued}}</div>
                <div class="date-key">Date Issued</div>
            </div>
        </div>

        <div class="right-content">
            <div class="presented">Proudly awarded to</div>
            <div class="student-name">{{.StudentName}}</div>
            <div class="name-underline"></div>
            <div class="for-text">For successfully completing the course</div>
            <div class="course-name">{{.CourseName}}</div>
            <div class="sig-row">
                <div class="sig-block">
                    <div class="sig-hr">
                        <div class="sig-val">{{.TeacherName}}</div>
                        <div class="sig-key">Lead Instructor</div>
                    </div>
                </div>
                <div class="green-badge"><span>✓</span></div>
            </div>
        </div>
    </div>
</body>
</html>
