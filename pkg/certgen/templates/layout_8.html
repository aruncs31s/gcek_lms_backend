<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate of Completion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1056px;
            height: 816px;
            background: #0a1f24;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #certificate {
            width: 1010px;
            height: 780px;
            background: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 60px rgba(0,180,150,0.2);
        }

        /* Geometric header */
        .geo-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 200px;
            background: #0d6e68;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 0 100%);
        }
        .geo-header-accent {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 200px;
            background: linear-gradient(90deg, #08524e, #0d9488, #08524e);
            clip-path: polygon(0 0, 100% 0, 100% 60%, 0 88%);
            opacity: 0.6;
        }

        /* Geometric bottom decoration */
        .geo-footer {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 100px;
            background: #0d6e68;
            clip-path: polygon(0 100%, 100% 40%, 100% 100%);
        }
        .geo-strip {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 8px;
            background: linear-gradient(90deg, #0d9488, #00ccc0, #0d9488);
        }

        /* Side triangle */
        .side-triangle {
            position: absolute;
            top: 0; right: 0;
            width: 0; height: 0;
            border-top: 200px solid rgba(0,188,180,0.15);
            border-left: 200px solid transparent;
        }

        /* Top content */
        .top-content {
            position: absolute;
            top: 20px; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            z-index: 2;
        }
        .top-content img { height: 60px; filter: brightness(0) invert(1); opacity: 0.9; }
        .top-right-text { text-align: right; }
        .top-right-text .label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
        }
        .top-right-text .title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            color: #fff;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Body */
        .body-content {
            position: absolute;
            top: 200px; left: 0; right: 0; bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 80px;
            text-align: center;
        }

        .awarded-to {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #0d9488;
            margin-bottom: 8px;
        }

        .student-name {
            font-family: 'Merriweather', serif;
            font-size: 3rem;
            color: #0a1f24;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .teal-underline {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #0d9488, #00ccc0);
            margin: 0 auto 24px;
            border-radius: 2px;
        }

        .has-completed {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .course-name {
            font-family: 'Merriweather', serif;
            font-size: 1.7rem;
            color: #0d6e68;
            max-width: 660px;
            line-height: 1.3;
        }

        /* Footer */
        .sig-row {
            position: absolute;
            bottom: 110px;
            left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 100px;
        }
        .sig-block { text-align: center; }
        .sig-top-line {
            width: 140px;
            height: 2px;
            background: #0d9488;
            margin: 0 auto 8px;
        }
        .sig-val {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0a1f24;
            letter-spacing: 1px;
        }
        .sig-key {
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #aaa;
            font-family: 'Rajdhani', sans-serif;
        }
    </style>
</head>
<body>
    <div id="certificate">
        <div class="geo-header"></div>
        <div class="geo-header-accent"></div>
        <div class="geo-footer"></div>
        <div class="geo-strip"></div>
        <div class="side-triangle"></div>

        <div class="top-content">
            <img src="{{.LogoDataURI}}" alt="Logo">
            <div class="top-right-text">
                <div class="label">Official Certification</div>
                <div class="title">Certificate of<br>Completion</div>
            </div>
        </div>

        <div class="body-content">
            <div class="awarded-to">Awarded to</div>
            <div class="student-name">{{.StudentName}}</div>
            <div class="teal-underline"></div>
            <div class="has-completed">Has successfully completed</div>
            <div class="course-name">{{.CourseName}}</div>
        </div>

        <div class="sig-row">
            <div class="sig-block">
                <div class="sig-top-line"></div>
                <div class="sig-val">{{.DateIssued}}</div>
                <div class="sig-key">Date Issued</div>
            </div>
            <div class="sig-block">
                <div class="sig-top-line"></div>
                <div class="sig-val">{{.TeacherName}}</div>
                <div class="sig-key">Lead Instructor</div>
            </div>
        </div>
    </div>
</body>
</html>
