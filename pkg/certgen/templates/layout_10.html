<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate of Completion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1056px;
            height: 816px;
            background: #1a0404;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #certificate {
            width: 1010px;
            height: 780px;
            background: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 60px rgba(150,20,20,0.3);
        }

        /* Bold red left column */
        .red-column {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 260px;
            background: linear-gradient(170deg, #8b0000 0%, #a61010 60%, #cc1818 100%);
        }

        /* Red column diagonal bottom decoration */
        .red-col-deco {
            position: absolute;
            left: 0; bottom: 0;
            width: 260px; height: 200px;
            background: rgba(0,0,0,0.15);
            clip-path: polygon(0 100%, 100% 0, 100% 100%);
        }

        /* Columnar vertical text */
        .column-content {
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            z-index: 2;
        }

        .col-logo { margin-bottom: 30px; }
        .col-logo img { height: 65px; filter: brightness(0) invert(1); opacity: 0.92; }

        .col-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2.8rem;
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
            text-align: center;
        }
        .col-of {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 8px;
            color: rgba(255,220,220,0.8);
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 30px;
        }

        .col-divider {
            width: 40px; height: 2px;
            background: rgba(255,255,255,0.3);
            margin: 12px 0;
        }

        .col-date {
            text-align: center;
            margin-top: 20px;
        }
        .col-date .dval { color: #fff; font-family: 'Lora', serif; font-size: 0.9rem; }
        .col-date .dkey { color: rgba(255,180,180,0.7); font-family: 'Oswald', sans-serif; font-size: 0.45rem; letter-spacing: 4px; text-transform: uppercase; margin-top: 4px; }

        /* Gold accent line between columns */
        .accent-line {
            position: absolute;
            left: 260px; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #ffcc00, #ff9900, #ffcc00);
            z-index: 3;
        }

        /* Right body */
        .right-body {
            position: absolute;
            left: 264px; right: 0; top: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 60px;
        }

        .institution-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #cc1818;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .presented-to {
            font-family: 'Oswald', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #bbb;
            margin-bottom: 6px;
        }

        .student-name {
            font-family: 'Lora', serif;
            font-size: 3.1rem;
            color: #1a0404;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .red-bar { width: 60px; height: 4px; background: #cc1818; margin-bottom: 22px; }

        .course-intro {
            font-family: 'Oswald', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 6px;
        }

        .course-name {
            font-family: 'Lora', serif;
            font-size: 1.7rem;
            color: #8b0000;
            font-weight: 700;
            max-width: 580px;
            line-height: 1.3;
            margin-bottom: 36px;
        }

        .sig-block {
            min-width: 160px;
        }
        .sig-hr { border-top: 2px solid #8b0000; padding-top: 8px; }
        .sig-top-deco { width: 30px; height: 2px; background: #ffcc00; margin-bottom: 6px; }
        .sig-val { font-family: 'Oswald', sans-serif; font-size: 0.85rem; color: #1a0404; font-weight: 600; letter-spacing: 1px; }
        .sig-key { font-family: 'Oswald', sans-serif; font-size: 0.55rem; letter-spacing: 3px; text-transform: uppercase; color: #aaa; margin-top: 3px; }

        /* Watermark / seal */
        .seal-mark {
            position: absolute;
            right: 50px; bottom: 40px;
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 3px solid #8b0000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.12;
        }
        .seal-mark .sm-text { font-family: 'Oswald', sans-serif; font-size: 0.5rem; letter-spacing: 2px; text-transform: uppercase; color: #8b0000; }
        .seal-mark .sm-star { font-size: 1.5rem; color: #8b0000; }
    </style>
</head>
<body>
    <div id="certificate">
        <div class="red-column"></div>
        <div class="red-col-deco"></div>

        <div class="column-content">
            <div class="col-logo"><img src="{{.LogoDataURI}}" alt="Logo"></div>
            <div class="col-title">Certifi&shy;cate</div>
            <div class="col-divider"></div>
            <div class="col-of">of Completion</div>
            <div class="col-divider"></div>
            <div class="col-date">
                <div class="dval">{{.DateIssued}}</div>
                <div class="dkey">Date Issued</div>
            </div>
        </div>

        <div class="accent-line"></div>

        <div class="right-body">
            <div class="institution-label">ESDC · Learning Management System</div>
            <div class="presented-to">This certificate is awarded to</div>
            <div class="student-name">{{.StudentName}}</div>
            <div class="red-bar"></div>
            <div class="course-intro">For successfully completing the course</div>
            <div class="course-name">{{.CourseName}}</div>

            <div class="sig-block">
                <div class="sig-top-deco"></div>
                <div class="sig-hr">
                    <div class="sig-val">{{.TeacherName}}</div>
                    <div class="sig-key">Lead Instructor</div>
                </div>
            </div>
        </div>

        <div class="seal-mark">
            <div class="sm-star">★</div>
            <div class="sm-text">Certified</div>
        </div>
    </div>
</body>
</html>
