<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate of Completion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Nunito:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1056px;
            height: 816px;
            background: #1a0a2e;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #certificate {
            width: 1010px;
            height: 780px;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1155 35%, #4a1f88 60%, #6b2fb0 80%, #5a24a0 100%);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(200,150,255,0.3);
        }

        /* Stars/particle effect */
        .star-bg {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1px),
                radial-gradient(circle, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 180px 180px, 120px 120px, 80px 80px;
            background-position: 0 0, 60px 60px, 30px 30px;
        }

        /* Glowing circle */
        .glow-circle {
            position: absolute;
            top: -100px; right: -80px;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(150,100,255,0.4) 0%, transparent 70%);
        }
        .glow-circle2 {
            position: absolute;
            bottom: -80px; left: -60px;
            width: 300px; height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100,50,200,0.3) 0%, transparent 70%);
        }

        /* Gold border */
        #certificate::before {
            content: '';
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(200,150,255,0.3);
            pointer-events: none;
            z-index: 3;
        }

        .content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 4;
            padding: 50px 100px;
            text-align: center;
        }

        .logo-area { margin-bottom: 8px; }
        .logo-area img { height: 50px; filter: brightness(0) invert(1); opacity: 0.9; }

        .inst-tag {
            font-family: 'Nunito', sans-serif;
            font-size: 0.55rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(200,150,255,0.8);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .cert-main {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1;
        }
        .cert-of {
            font-family: 'Nunito', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: rgba(200,150,255,0.8);
            margin-top: 4px;
            margin-bottom: 20px;
        }

        .purple-divider {
            display: flex; align-items: center; gap: 12px;
            width: 400px; margin: 0 auto 20px;
        }
        .pdiv-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(200,150,255,0.6), transparent); }
        .pdiv-gem { color: rgba(200,150,255,0.8); font-size: 0.7rem; }

        .presented-to {
            font-family: 'Nunito', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }

        .student-name {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #fff;
            font-style: italic;
            text-shadow: 0 0 40px rgba(200,150,255,0.6);
            margin-bottom: 18px;
            line-height: 1.1;
        }

        .course-desc {
            font-family: 'Nunito', sans-serif;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .course-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.55rem;
            color: #d4a8ff;
            max-width: 680px;
            line-height: 1.3;
            margin-bottom: 24px;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 8px;
        }
        .sig-block { text-align: center; min-width: 140px; }
        .sig-line { border-top: 1px solid rgba(200,150,255,0.3); padding-top: 8px; }
        .sig-val { color: rgba(255,255,255,0.9); font-size: 0.8rem; font-family: 'Nunito', sans-serif; font-weight: 600; }
        .sig-key { color: rgba(200,150,255,0.6); font-size: 0.55rem; letter-spacing: 3px; text-transform: uppercase; margin-top: 3px; }
    </style>
</head>
<body>
    <div id="certificate">
        <div class="star-bg"></div>
        <div class="glow-circle"></div>
        <div class="glow-circle2"></div>

        <div class="content">
            <div class="logo-area"><img src="{{.LogoDataURI}}" alt="Logo"></div>
            <div class="inst-tag">ESDC · Learning Management System</div>

            <div class="cert-main">Certificate</div>
            <div class="cert-of">of Completion</div>

            <div class="purple-divider">
                <div class="pdiv-line"></div>
                <div class="pdiv-gem">✦</div>
                <div class="pdiv-line"></div>
            </div>

            <div class="presented-to">This certificate is awarded to</div>
            <div class="student-name">{{.StudentName}}</div>

            <div class="course-desc">In recognition of successfully completing</div>
            <div class="course-name">{{.CourseName}}</div>

            <div class="purple-divider">
                <div class="pdiv-line"></div>
                <div class="pdiv-gem">✦</div>
                <div class="pdiv-line"></div>
            </div>

            <div class="footer-row">
                <div class="sig-block">
                    <div class="sig-line">
                        <div class="sig-val">{{.DateIssued}}</div>
                        <div class="sig-key">Date Issued</div>
                    </div>
                </div>
                <div class="sig-block">
                    <div class="sig-line">
                        <div class="sig-val">{{.TeacherName}}</div>
                        <div class="sig-key">Lead Instructor</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
