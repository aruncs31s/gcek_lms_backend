<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate of Completion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            width: 1056px;
            height: 816px;
            background: #f5f0e8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #certificate {
            width: 1010px;
            height: 780px;
            background: #fff;
            position: relative;
            overflow: hidden;
            border: 2px solid #b8972a;
            box-shadow: 0 0 40px rgba(0,0,0,0.15);
        }

        /* Decorative corner ornaments via border */
        #certificate::before {
            content: '';
            position: absolute;
            inset: 12px;
            border: 1px solid #b8972a;
            pointer-events: none;
            z-index: 2;
        }

        .bg-stripe-left {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 220px;
            background: linear-gradient(160deg, #1a2f5e 60%, #243a72);
        }
        .bg-stripe-right {
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 220px;
            background: linear-gradient(200deg, #1a2f5e 60%, #243a72);
        }

        .gold-line-top {
            position: absolute;
            top: 30px; left: 220px; right: 220px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c9a227, transparent);
        }
        .gold-line-bot {
            position: absolute;
            bottom: 30px; left: 220px; right: 220px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c9a227, transparent);
        }

        .logo-left {
            position: absolute;
            left: 30px; top: 50%;
            transform: translateY(-50%);
            width: 160px;
            text-align: center;
        }
        .logo-left img {
            width: 110px;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }
        .logo-left .inst-name {
            color: #c9a227;
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: 600;
        }

        .seal-right {
            position: absolute;
            right: 55px; top: 50%;
            transform: translateY(-50%);
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #c9a227, #8a6a10);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid #f5e09a;
            box-shadow: 0 0 20px rgba(201,162,39,0.5);
        }
        .seal-right span {
            color: #fff;
            font-size: 0.45rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .seal-right .star { font-size: 2rem; color: #fff; }

        .body-content {
            position: absolute;
            left: 220px; right: 220px;
            top: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
            text-align: center;
        }

        .cert-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            color: #1a2f5e;
            letter-spacing: 6px;
            text-transform: uppercase;
            line-height: 1;
        }
        .cert-subtitle {
            font-size: 0.7rem;
            letter-spacing: 8px;
            color: #c9a227;
            text-transform: uppercase;
            margin-top: 6px;
            font-weight: 600;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            width: 100%;
        }
        .divider-line { flex: 1; height: 1px; background: #c9a227; }
        .divider-diamond { width: 8px; height: 8px; background: #c9a227; transform: rotate(45deg); flex-shrink: 0; }

        .presented-text {
            font-size: 0.75rem;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .student-name {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: #1a2f5e;
            font-style: italic;
            margin: 10px 0;
            line-height: 1.1;
        }

        .course-desc {
            font-size: 0.72rem;
            color: #666;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        .course-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: #1a2f5e;
            font-weight: 600;
            margin: 8px 0 20px;
            line-height: 1.3;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 16px;
        }
        .sig-block { text-align: center; min-width: 130px; }
        .sig-line { border-top: 1px solid #c9a227; padding-top: 6px; }
        .sig-name { font-weight: 600; color: #1a2f5e; font-size: 0.75rem; }
        .sig-role { font-size: 0.65rem; color: #888; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="certificate">
        <div class="bg-stripe-left"></div>
        <div class="bg-stripe-right"></div>
        <div class="gold-line-top"></div>
        <div class="gold-line-bot"></div>

        <div class="logo-left">
            <img src="{{.LogoDataURI}}" alt="Logo">
            <div class="inst-name">ESDC · LMS</div>
        </div>

        <div class="seal-right">
            <span class="star">★</span>
            <span>Excellence</span>
        </div>

        <div class="body-content">
            <div class="cert-title">Certificate</div>
            <div class="cert-subtitle">of Completion</div>

            <div class="divider"><div class="divider-line"></div><div class="divider-diamond"></div><div class="divider-line"></div></div>

            <div class="presented-text">This is proudly presented to</div>
            <div class="student-name">{{.StudentName}}</div>

            <div class="course-desc">For successfully completing and demonstrating exceptional proficiency in</div>
            <div class="course-name">{{.CourseName}}</div>

            <div class="divider"><div class="divider-line"></div><div class="divider-diamond"></div><div class="divider-line"></div></div>

            <div class="footer-row">
                <div class="sig-block">
                    <div class="sig-line">
                        <div class="sig-name">{{.DateIssued}}</div>
                        <div class="sig-role">Date Issued</div>
                    </div>
                </div>
                <div class="sig-block">
                    <div class="sig-line">
                        <div class="sig-name">{{.TeacherName}}</div>
                        <div class="sig-role">Lead Instructor</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
